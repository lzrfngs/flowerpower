<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foot Studio</title>
<style>
  :root { --bg:#08080c; --panel:rgba(18,18,24,.78); --line:rgba(255,255,255,.09); --txt:#e9e6ee; --dim:#8d8a99; --acc:#ff7fa5; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:13px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  canvas#c.pull { cursor:grabbing; }
  #vig { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 45% 55%, transparent 45%, rgba(0,0,0,.55) 100%); }
  #panel { position:fixed; top:12px; right:12px; bottom:12px; width:268px; padding:14px 14px 18px; overflow-y:auto;
    background:var(--panel); border:1px solid var(--line); border-radius:14px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  #panel h1 { font-size:14px; letter-spacing:.14em; text-transform:uppercase; margin:0 0 2px; font-weight:600; }
  #panel h2 { font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin:16px 0 7px; font-weight:600; }
  .sub { color:var(--dim); font-size:11.5px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  button { font:inherit; color:var(--txt); background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:8px; padding:7px 8px; cursor:pointer; }
  button:hover { background:rgba(255,255,255,.1); }
  button.on { border-color:var(--acc); background:rgba(255,127,165,.16); }
  .row { display:flex; align-items:center; gap:8px; margin:7px 0; }
  .row label { flex:0 0 78px; color:var(--dim); }
  .row input[type=range] { flex:1; min-width:0; accent-color:var(--acc); }
  .sw { display:flex; flex-wrap:wrap; gap:7px; }
  .sw button { width:26px; height:26px; padding:0; border-radius:50%; border:2px solid rgba(255,255,255,.15); }
  .sw button.on { border-color:#fff; box-shadow:0 0 0 2px var(--acc); }
  .toggle { width:100%; display:flex; justify-content:space-between; align-items:center; }
  .toggle i { font-style:normal; color:var(--dim); }
  .toggle.on i { color:var(--acc); }
  #hint { position:fixed; left:16px; bottom:14px; color:var(--dim); font-size:12px; pointer-events:none; text-shadow:0 1px 3px #000; }
  #load { position:fixed; inset:0; display:grid; place-items:center; background:var(--bg); color:var(--dim); letter-spacing:.2em; text-transform:uppercase; font-size:11px; transition:opacity .5s; }
  #panelBtn { display:none; }
  @media (max-width:700px) {
    #panel { top:auto; left:8px; right:8px; bottom:8px; width:auto; max-height:46vh; transition:transform .25s; }
    #panel.closed { transform:translateY(calc(100% - 44px)); overflow:hidden; }
    #panelBtn { display:block; position:absolute; top:8px; right:10px; padding:4px 10px; }
    #hint { bottom:auto; top:10px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div id="hint">Drag to orbit &middot; scroll to zoom &middot; drag on the hosiery to pull it &mdash; pull far to rip</div>

<div id="panel">
  <button id="panelBtn">&#9776;</button>
  <h1>Foot Studio</h1>
  <div class="sub">3D pose &amp; material viewer</div>

  <h2>Pose</h2>
  <div class="grid" id="poses"></div>
  <div class="row" style="margin-top:9px"><button class="toggle on" id="wiggle"><span>Idle toe motion</span><i>on</i></button></div>

  <h2>Foot type</h2>
  <div class="grid" id="types"></div>
  <div class="row"><label>Width</label><input type="range" id="width" min="-1" max="1" step="0.01" value="0"></div>
  <div class="row"><label>Arch</label><input type="range" id="arch" min="-1" max="1" step="0.01" value="0.2"></div>
  <div class="row"><label>Toe length</label><input type="range" id="toeLen" min="-1" max="1" step="0.01" value="0"></div>

  <h2>Skin</h2>
  <div class="sw" id="tones"></div>
  <div class="row"><label>Dampness</label><input type="range" id="damp" min="0" max="1" step="0.01" value="0.15"></div>
  <div class="row"><label>Blush</label><input type="range" id="blush" min="0" max="1" step="0.01" value="0.6"></div>

  <h2>Nails</h2>
  <div class="sw" id="nails"></div>

  <h2>Hosiery</h2>
  <button class="toggle on" id="hoseOn"><span>Pantyhose</span><i>on</i></button>
  <div class="sw" id="hoseColors" style="margin-top:9px"></div>
  <div class="row"><label>Denier</label><input type="range" id="denier" min="0" max="1" step="0.01" value="0.4"></div>
  <div class="row"><button id="mend" style="flex:1">Mend rips</button></div>
  <div class="sub" id="ripCount"></div>

  <h2>Credits</h2>
  <div class="sub">Leg mesh &amp; rig: MakeHuman base mesh (CC0). Rendering: three.js (MIT).</div>
</div>
<div id="load">Loading</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
